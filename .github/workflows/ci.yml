name: CI

on:
  push:
    branches: [preset-bus, main, hoc-midi, xeno-instrument]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One script, shared with the bench. The list of suites and the warning
      # flags used to live here and be copied by hand on the other side; the
      # two drifted and let real bugs through green.
      - name: Build and run host test suites
        run: software/test/run-host-tests.sh

      - name: Fork gates
        run: tools/ci/fork-gates.sh

  # The same 25 suites under AddressSanitizer and UBSan. Added 2026-09-14
  # after the plain build missed a test that wrote 16 ints past the end of its
  # own array: harmless under one compiler's layout, a corrupted result counter
  # under the other's, and found by the sanitizer in seconds once it was run.
  # Separate job so a sanitizer finding is legible on its own, and so the
  # gating build stays fast.
  host-tests-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host test suites under ASan + UBSan
        run: SAN=1 software/test/run-host-tests.sh

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This fork builds for the Xenomorpher (T4.1/O.R.N.8) only. The
        # T3.2/T4.0/older-NLM environments were deleted from platformio.ini
        # in the 2026-09-13 hard fork; there is nothing left to build for
        # them. T41_MTP (the slot-2 recovery image) is deliberately outside
        # the matrix: build it by hand when it changes.
        env: [T41, T41_audio, T41_audio_dbg, T41_console]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('software/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ${{ matrix.env }}
        working-directory: software
        run: pio run -e ${{ matrix.env }}
