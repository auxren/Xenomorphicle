; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
default_envs =
;  T32
;  T32_vor
  T40
  nlm_cardoc_T40
  T41
  T41_audio
  T41_MTP

[env]
framework = arduino
platform = https://github.com/platformio/platform-teensy.git
platform_packages =
  tool-teensy
;  framework-arduinoteensy @ 1.159.0
  framework-arduinoteensy @ https://github.com/djphazer/framework-arduinoteensy.git#63259f03b225db6fa45138ec2bc0cc53c4e4a513
  tool-sreccat
build_flags =
  -DTEENSY_OPT_SMALLEST_CODE
  -DUSB_MIDI
;  -DUSB_MIDI_AUDIO_SERIAL
;  -DUSB_MIDI_SERIAL
;    -DOC_DEV
;    -DPRINT_DEBUG
  -Isrc/extern
  -Isrc/extern/f32
  -fno-exceptions
  -falign-functions=32
  -falign-loops=32
  -falign-jumps=32
  -Wall
  -Wfatal-errors
;  -Wl,-Map,firmware.map
;  -Wconversion
;  -Wextra
;  -Werror

extra_scripts =
  pre:res/progname.py
  pre:res/flashmem_lto.py

upload_protocol = teensy-gui

[env:T3]
extends = env
board = teensy31
board_build.f_cpu = 120000000
lib_deps = EEPROM
lib_ignore = USBHost_t36, Audio, Wire, SPI, SD, LittleFS, SerialFlash

[env:custom]
extends = env:T3
build_flags =
    ${env.build_flags}
    ${sysenv.CUSTOM_BUILD_FLAGS}
    -DOC_VERSION_EXTRA="\"_custom\""

[env:T4]
build_flags =
  ${env.build_flags}
;  -DPEWPEWPEW
  -DTEENSY_OPT_SMALLEST_CODE_LTO
  -DDRUMMAP_GRIDS2
  -DENABLE_APP_CALIBR8OR
  -DENABLE_APP_SCENES
  -DENABLE_APP_ENIGMA
  -DENABLE_APP_MIDI
  -DENABLE_APP_PONG
  -DENABLE_APP_PIQUED
  -DENABLE_APP_POLYLFO
  -DENABLE_APP_H1200
  -DENABLE_APP_BYTEBEATGEN
  -DENABLE_APP_NEURAL_NETWORK
  -DENABLE_APP_DARKEST_TIMELINE
  -DENABLE_APP_LORENZ
  -DENABLE_APP_ASR
  -DENABLE_APP_QUANTERMAIN
  -DENABLE_APP_METAQ
  -DENABLE_APP_CHORDS
  -DENABLE_APP_PASSENCORE
  -DENABLE_APP_SEQUINS
  -DENABLE_APP_AUTOMATONNETZ
  -DENABLE_APP_BBGEN
;  -DENABLE_APP_REFERENCES

[env:T40]
board = teensy40
board_build.f_cpu = 300000000
lib_ignore = Audio, Wire
build_flags = ${env:T4.build_flags}
  -DOC_VERSION_EXTRA="\"_T40\""

[env:T41]
board = teensy41
board_build.f_cpu = 600000000
board_build.ldscript = slot1.ld
build_flags = ${env.build_flags}
; -DPEWPEWPEW
  -DDEFAULT_APP_MIDI
  -DTEENSY_OPT_SMALLEST_CODE_LTO
  -Iteensy-variable-playback/src
  -falign-functions=32
  -falign-loops=32
  -falign-jumps=32
  -DPRESET_BUS
  -DDRUMMAP_GRIDS2
  -DENABLE_APP_CALIBR8OR
  -DENABLE_APP_SCENES
  -DENABLE_APP_MIDI
  -DCAPTAIN_SETUP_COUNT=4
  -DENABLE_APP_PONG
; 200e module tools over the preset bus; needs PRESET_BUS (set above)
  -DENABLE_APP_BUS200E
;  -DENABLE_APP_PIQUED
;  -DENABLE_APP_POLYLFO
;  -DENABLE_APP_BYTEBEATGEN
;  -DENABLE_APP_REFERENCES
;  -DENABLE_APP_BBGEN
;  -DENABLE_APP_PASSENCORE
;  -DENABLE_APP_AUTOMATONNETZ
;  -DENABLE_APP_LORENZ
;  -DENABLE_APP_SEQUINS
;  -DENABLE_APP_H1200
;  -DENABLE_APP_QUANTERMAIN
  -DOC_VERSION_EXTRA="\"_T41\""

build_src_filter = +<*> +<../teensy-variable-playback/src/*.cpp>

[env:T41_audio]
extends = env:T41
board_build.ldscript = slot0.ld
build_flags =
  ${env:T41.build_flags}
  -DMULTIBOOT
;  -DUSB_MIDI_AUDIO_SERIAL
  -DAUDIO_USB_CHANNEL_COUNT=4
  -DUSB_AUDIO
  -DAUDIO_SUBSLOT_SIZE=3
  -DENABLE_APP_TUNER
  -DENABLE_APP_TWEIGHTY
  -DENABLE_APP_SCOPE
  -DENABLE_APP_SAMPLER
  -DENABLE_APP_USBDRIVE
  -DENABLE_APP_DELAY
  -DENABLE_APP_REVERB

; bus bring-up build: adds USB serial (debug console) + boot trace
[env:T41_audio_dbg]
extends = env:T41_audio
build_flags =
  ${env:T41_audio.build_flags}
  -UUSB_MIDI
  -UUSB_AUDIO
  -DUSB_MIDI_AUDIO_SERIAL
  -DPRINT_DEBUG
  -DOC_DEBUG_APPS

; console build for 200e/preset-bus bench work: USB serial + MIDI, NO USB audio.
;
; T41_audio_dbg (audio + serial + the 200e app) does not fit: it leaves only
; 4,544 bytes of stack and overflows the MPU guard during boot -- confirmed by
; a DACCVIOL fault at 0x2001EE40, exactly 0x20000000 + the DTCM variables size.
; Dropping USB audio frees ~5.3KB of DTCM (the in/out USB audio buffers and
; their machinery), which puts this at 9,856 bytes free -- above the 8,608 that
; is known to boot cleanly.
;
; Deliberately NOT solved by moving const tables to PROGMEM: the big DTCM
; tables here (sinTable_f32, the waveform LUTs) are read from the audio ISR,
; so relocating them to flash would trade a boot problem for a hot-path
; regression. Bus/MIDI bench work does not need USB audio at all, so this
; costs nothing that matters -- use T41_audio when audio IS the point.
[env:T41_console]
extends = env:T41_audio
build_flags =
  ${env:T41_audio.build_flags}
  -UUSB_MIDI
  -UUSB_AUDIO
  -DUSB_MIDI_SERIAL
  -DPRINT_DEBUG
  -DOC_DEBUG_APPS

; latency A/B build for the bench session: half the block size, same slot
[env:T41_audio_blk64]
extends = env:T41_audio
build_flags =
  ${env:T41_audio.build_flags}
  -DAUDIO_BLOCK_SAMPLES=64

[env:T41_MTP]
extends = env:T41
board_build.ldscript = slot2.ld
build_flags = ${env.build_flags}
  -DTEENSY_OPT_SMALLEST_CODE_LTO
  -DUSB_MTPDISK
  -DNO_HEMISPHERE
; stock apps
  -DENABLE_APP_ASR
  -DENABLE_APP_QUANTERMAIN
  -DENABLE_APP_METAQ
  -DENABLE_APP_CHORDS
  -DENABLE_APP_SEQUINS
  -DENABLE_APP_AUTOMATONNETZ
  -DENABLE_APP_LORENZ
  -DENABLE_APP_PIQUED
  -DENABLE_APP_POLYLFO
  -DENABLE_APP_H1200
  -DENABLE_APP_BYTEBEATGEN
  -DENABLE_APP_BBGEN
  -DENABLE_APP_REFERENCES
; HS Apps
  -DENABLE_APP_ENIGMA
  -DENABLE_APP_MIDI
  -DENABLE_APP_NEURAL_NETWORK
  -DENABLE_APP_DARKEST_TIMELINE
  -DENABLE_APP_PONG
; extra
  -DENABLE_APP_PASSENCORE
  -DENABLE_APP_CALIBR8OR
  -DENABLE_APP_SCENES
  -nostartfiles
  -nostdlib
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DOC_VERSION_EXTRA="\"_T41\""

extra_scripts =
  ${env.extra_scripts}
  post:res/assemble-multiboot.py

[env:T41_dev]
extends = env:T41
lib_deps =
